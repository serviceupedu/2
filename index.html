
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102B50">
<title>월드인재개발원 | 한선희</title>
<style>
  :root {
    --navy: #102B50;
    --deep: #091C36;
    --blue: #275B91;
    --light: #F0F5FA;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #E8EDF3;
    font-family: "Pretendard", "Noto Sans KR",
                 "Apple SD Gothic Neo", sans-serif;
    color: var(--deep);
    line-height: 1.6;
  }
  .card {
    max-width: 480px;
    min-height: 100svh;
    margin: auto;
    background: white;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 35px #102B5018;
  }
  header {
    padding: 48px 28px 52px;
    background: linear-gradient(145deg, #091C36, #173D6C);
    color: white;
    border-radius: 0 0 30px 30px;
  }
  .company {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #BFD8F2;
  }
  .line {
    width: 40px;
    height: 3px;
    background: #84B8EC;
    margin: 28px 0;
  }
  h1 {
    font-size: 46px;
    margin: 0;
    font-weight: 800;
    letter-spacing: -2px;
  }
  .role {
    font-size: 19px;
    margin: 4px 0 0;
    color: #C9DDF0;
    font-weight: 600;
  }
  .intro {
    font-size: 21px;
    margin: 28px 0 0;
    line-height: 1.8;
    word-break: keep-all;
  }
  main {
    padding: 36px 24px 28px;
    flex: 1;
  }
  .label {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--blue);
  }
  h2 {
    font-size: 28px;
    margin: 7px 0 26px;
    letter-spacing: -1px;
  }
  .service {
    display: flex;
    align-items: flex-start;
    gap: 15px;
    background: var(--light);
    padding: 24px 18px;
    border-radius: 18px;
    border-left: 4px solid var(--navy);
    margin-bottom: 16px;
  }
  .num {
    font-size: 18px;
    font-weight: 800;
    color: var(--blue);
    min-width: 28px;
  }
  .service h3 {
    font-size: 21px;
    margin: 0 0 9px;
    line-height: 1.4;
    color: var(--navy);
    letter-spacing: -0.6px;
  }
  .service p {
    font-size: 16px;
    color: #455B72;
    margin: 0;
    line-height: 1.7;
    word-break: keep-all;
  }
  footer {
    padding: 12px 24px 36px;
    text-align: center;
  }
  .contact {
    display: block;
    width: 100%;
    padding: 20px;
    border: 0;
    border-radius: 14px;
    background: var(--navy);
    color: white;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
  }
  .contact:active {
    background: var(--blue);
    transform: scale(0.98);
  }
  .contact:focus-visible {
    outline: 3px solid #589BDB;
    outline-offset: 3px;
  }
  .copyright {
    margin: 20px 0 0;
    font-size: 12px;
    color: #8798AA;
    letter-spacing: 0.5px;
  }
  @media (max-width: 360px) {
    h1 { font-size: 41px; }
    .intro { font-size: 19px; }
    .service h3 { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="card">

  <header>
    <div class="company">월드인재개발원</div>
    <div class="line"></div>
    <h1>한선희</h1>
    <p class="role">대표 · 기업교육 전문가</p>
    <p class="intro">
      고객을 이해하고,<br>
      서비스와 세일즈 역량을 높이며<br>
      사람과 조직의 성장을 돕습니다.
    </p>
  </header>

  <main>
    <div class="label">EDUCATION EXPERTISE</div>
    <h2>주요 교육 분야</h2>

    <section class="service">
      <span class="num">01</span>
      <div>
        <h3>서비스·CX &amp; 세일즈</h3>
        <p>고객의 마음을 움직이는 서비스와
           세일즈 역량</p>
      </div>
    </section>

    <section class="service">
      <span class="num">02</span>
      <div>
        <h3>고객행동 &amp; 구매심리</h3>
        <p>고객의 행동을 읽고 구매의사결정을
           이해하는 교육</p>
      </div>
    </section>

    <section class="service">
      <span class="num">03</span>
      <div>
        <h3>조직소통 &amp; 퍼실리테이션</h3>
        <p>사람과 조직의 성장을 돕는
           참여형 교육</p>
      </div>
    </section>
  </main>

  <footer>
    <button class="contact" onclick="contact()">
      문의하기 →
    </button>
    <p class="copyright">
      WORLD HUMAN RESOURCE DEVELOPMENT INSTITUTE
    </p>
  </footer>

</div>

<script>
  const contactEmail = "";

  function contact() {
    if (!contactEmail) {
      alert("문의 이메일 주소를 설정해주세요.");
      return;
    }
    const subject = encodeURIComponent(
      "월드인재개발원 기업교육 문의"
    );
    const message = encodeURIComponent(
      "안녕하세요. 기업교육 관련 문의드립니다.\n\n" +
      "기업명:\n담당자:\n연락처:\n" +
      "희망 교육 분야:\n문의 내용:\n"
    );
    window.location.href =
      `mailto:${contactEmail}?subject=${subject}&body=${message}`;
  }
</script>
</body>
</html>
